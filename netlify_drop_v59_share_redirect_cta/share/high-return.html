.share-redirect-box p {

    </div>
</noscript>
<script>
(function () {
    var seconds = 5;
    var el = document.getElementById("redirect-countdown");
    var target = "../index.html";
    var timer = setInterval(function () {
        seconds -= 1;
        if (el) el.textContent = seconds;
        if (seconds <= 0) {
            clearInterval(timer);
            window.location.href = target;
        }
    }, 1000);
})();
</script>
