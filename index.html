const PAGE_TITLES = {"home": "競馬過去問ドリル", "beginner": "はじめての方へ｜競馬過去問ドリル", "shindan": "競馬過去問ドリル｜タイプ診断", "stage1": "第1問：【展開】前が速すぎた日の差し脚", "stage2": "第2問：【瞬発力】最後の200mで問われる適性", "stage3": "第3問：【持久力】良馬場に潜む消耗戦", "stage4": "第4問：【コース】小回り2500mの位置取り勝負", "stage5": "第5問：【位置取り】内で我慢した者の勝負", "stage6": "第6問：【距離】3000mで試される折り合い", "stage7": "第7問：【性能】速すぎる流れを疑うべきか", "stage8": "第8問：【馬場】重い芝が常識を壊す", "stage9": "第9問：【消耗戦】止まらない先頭と大穴の影", "stage10": "第10問：【速度】止まらない先頭を捕まえられるか"};

function decodePage(b64) {
  const binary = atob(b64);
  const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
  return new TextDecoder("utf-8").decode(bytes);
}

function getRouteKey() {
  const params = new URLSearchParams(location.search);
  const stage = params.get("stage");
  const page = params.get("page") || "home";

  if (stage && /^\d+$/.test(stage)) {
    const n = Number(stage);
    if (n >= 1 && n <= 10) return "stage" + n;
  }
  if (page === "beginner") return "beginner";
  if (page === "shindan") return "shindan";
  return "home";
}

function loadRoute() {
  const key = getRouteKey();
  const frame = document.getElementById("app-frame");
  const src = PAGES_B64[key] ? decodePage(PAGES_B64[key]) : decodePage(PAGES_B64.home);

  document.title = PAGE_TITLES[key] || "競馬過去問ドリル";
  frame.style.height = "200px";
  frame.srcdoc = src;
  window.scrollTo(0, 0);
}

window.addEventListener("popstate", loadRoute);

window.addEventListener("message", function(event) {
  if (!event.data || event.data.type !== "keiba-frame-height") return;
  const frame = document.getElementById("app-frame");
  const h = Number(event.data.height);
  if (Number.isFinite(h) && h > 0) {
    frame.style.height = Math.max(h + 8, 200) + "px";
  }
});

loadRoute();
</script>
